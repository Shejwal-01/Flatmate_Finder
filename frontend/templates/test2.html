<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Two Sidebars</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
    }

    /* ===== SIDEBAR 1 ===== */
    .sidebar-1 {
      position: fixed;
      top: 0;
      left: -220px;
      width: 220px;
      height: 100vh;
      background: #1b2348;
      transition: left 0.3s ease;
      padding-top: 60px;
    }

    .sidebar-1.active {
      left: 0;
    }

    /* ===== SIDEBAR 2 ===== */
    .sidebar-2 {
      position: fixed;
      top: 0;
      left: -440px;
      width: 220px;
      height: 100vh;
      background: #2d3561;
      transition: left 0.3s ease;
      padding-top: 60px;
    }

    .sidebar-2.active {
      left: 220px; /* appears next to sidebar-1 */
    }

    /* ===== TOGGLE BUTTONS ===== */
    .toggle-btn {
      position: absolute;
      top: 15px;
      left: 100%;
      background: none;
      border: none;
      cursor: pointer;
    }

    .toggle-btn span {
      display: block;
      width: 28px;
      height: 4px;
      background: #bfdbe6;
      margin: 5px 0;
      border-radius: 2px;
    }

    /* ===== MENU ===== */
    ul {
      list-style: none;
    }

    li {
      padding: 14px 20px;
      color: #bfdbe6;
      cursor: pointer;
    }

    li:hover {
      background: rgba(255, 255, 255, 0.1);
    }

    /* ===== CONTENT ===== */
    .content {
      padding: 20px;
      margin-left: 20px;
    }
  </style>
</head>

<body>

  <!-- SIDEBAR 1 -->
  <div class="sidebar-1" id="sidebar1">
    <button class="toggle-btn" onclick="toggleSidebar1()">
      <span></span>
      <span></span>
      <span></span>
    </button>

    <ul>
      <li>Home</li>
      <li>Dashboard</li>
      <li>Profile</li>
    </ul>
  </div>

  <!-- SIDEBAR 2 -->
  <div class="sidebar-2" id="sidebar2">
    <button class="toggle-btn" onclick="toggleSidebar2()">
      <span></span>
      <span></span>
      <span></span>
    </button>

    <ul>
      <li>Posts</li>
      <li>Messages</li>
      <li>Settings</li>
    </ul>
  </div>

  <div class="content">
    <h2>Main Content Area</h2>
    <p>Both sidebars work independently.</p>
  </div>

  <script>
    function toggleSidebar1() {
      document.getElementById("sidebar1").classList.toggle("active");
    }

    function toggleSidebar2() {
      document.getElementById("sidebar2").classList.toggle("active");
    }
  </script>

</body>
</html>
