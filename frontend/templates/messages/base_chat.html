<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link
      rel="icon"
      type="image/png"
      href="{{ url_for('static', path='favicon.png') }}"
    />
    <title>{% block title %}FlatMate Finder{% endblock %}</title>

    <!-- Bootstrap CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <style>
      * {
        box-sizing: border-box;
        }

      body {
        margin: 0;
        background-color: #bfdbe6;
        overflow: hidden;
      }

      /* ===== GRID LAYOUT ===== */
      .app-layout {
        display: grid;
        grid-template-rows: 57px 1fr;
        grid-template-columns: 56px 200px 1fr;
        height: 100vh;
      }

      .app-layout.sidebar-expanded {
        grid-template-columns: 200px 200px 1fr;
      }

      header {
        grid-column: 1 / -1;
        background-color: #1b2348;
        z-index: 100;
      }

      /* ===== NAVBAR ===== */
      .navbar-brand img {
        position: relative;
        top: 0.5px;
        filter: drop-shadow(0 0 4px rgba(191, 219, 230, 0.6));
      }
      .navbar-brand span {
        position: relative;
        top: -1px;
      }

      .navbar {
        padding-top: 4px;
        padding-bottom: 4px;
        height: 56px;
        position: relative;
      }
      @media (max-width: 576px) {
        .navbar-brand span {
          font-size: 1.1rem;
        }
      }

      .dropdown-menu {
        position: absolute !important;
        top: 100%;
        right: 0;
        margin-top: 8px;
        transform-origin: top right;
        animation: fadeIn 0.15s ease-in-out;
      }

      @keyframes fadeIn {
        from {
          opacity: 0;
          transform: translateY(-5px);
        }

        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      /* ===== SIDEBAR ===== */
      .sidebar-wrapper {
        position: relative;
        background-color: #1b2348;
        width: 56px;
        transition: width 0.3s ease;
        z-index: 10;
      }
      .sidebar-expanded .sidebar-wrapper {
        width: 200px;
      }
      .sidebar {
        background-color: #1b2348;
        padding-top: 10px;
        display: flex;
        flex-direction: column;
        align-items: center;
      }
      .sidebar-wrapper {
        background-color: #1b2348;
        overflow: hidden;
      }

      .sidebar {
        padding-top: 10px;
        display: flex;
        flex-direction: column;
        align-items: stretch;
      }

      /* Toggle inside sidebar */
      .sidebar-toggle {
        background-color: #1b2348;
        color: #bfdbe6;
        border: none;
        height: 45px;
        font-size: 20px;
        cursor: pointer;
      }

      .sidebar-toggle:hover {
        background-color: #bfdbe6;
        color: #1b2348;
      }

      /* Sidebar buttons */
      .btn1 {
        background-color: #1b2348;
        color: #bfdbe6;
        height: 45px;
        border: none;
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 0 16px;
        white-space: nowrap;
        overflow: hidden;
      }

      .btn1:hover {
        background-color: #bfdbe6;
        color: #1b2348;
      }

      .btn1 span {
        opacity: 0;
        transition: opacity 0.2s ease;
      }

      /* Show text when expanded */
      .sidebar-expanded .btn1 span {
        opacity: 1;
      }

      /* Icon always visible */
      .icon {
        font-size: 18px;
        width: 24px;
        text-align: center;
      }
      .sidebar-toggle {
        background-color: #1b2348;
        color: #bfdbe6;
        border: none;
        height: 45px;
        font-size: 20px;
        cursor: pointer;
      }

      .sidebar-toggle:hover {
        background-color: #bfdbe6;
        color: #1b2348;
      }

      .sidebar .btn1:hover {
        background-color: #bfdbe6;
        color: #1b2348;
      }

      .sidebar .btn1:active {
        transform: scale(0.97);
      }

      .sidebar .btn1 {
        background-color: #1b2348;

        border-radius: 4px;
        color: #bfdbe6;
        height: 40px;
        width: 143px;
        border: 1px;
        margin: 10px 0;
        display: block;
      }
      .inbox-collapsed .chat-list {
        display: none;
      }

      .inbox-wrapper {
        position: relative;
        border-left: none;
        background-color: #1b2348;
        width: 200px;
        min-width: 200px;
        max-width: 200px;
        transition: width 0.3s ease;
        z-index: 20; 
        overflow: hidden;
        flex-shrink: 0;
      }
      .app-layout.inbox-collapsed {
        grid-template-columns: 56px 56px 1fr;
      }
      .app-layout.sidebar-expanded.inbox-collapsed {
        grid-template-columns: 200px 56px 1fr;
      }
      .inbox-collapsed .inbox-wrapper {
        width: 56px;
        min-width: 56px;
        max-width: 56px;
      }

      .inbox {
        display: flex;
        flex-direction: column;
        padding-top: 10px;
      }

      .inbox-toggle {
        background-color: #1b2348;
        color: #bfdbe6;
        border: none;
        height: 45px;
        font-size: 20px;
        cursor: pointer;
      }

      .inbox-toggle:hover {
        background-color: #bfdbe6;
        color: #1b2348;
      }

      .chat-list {
        width: 200px;
        background-color: #1b2348;

        overflow-y: auto;
      }

      /* ===== MAIN CONTENT ===== */

      .chat-item {
        display: block;
        padding: 12px 16px;
        text-decoration: none;
        color: #4da3ff;
        /* username */
      }

      .chat-item strong {
        color: #4da3ff;
      }

      .chat-item .flat-location {
        display: block;
        color: #d1d9ff;
        font-size: 0.85rem;
        margin-top: 2px;
      }

      .chat-item:hover {
        background-color: #bfdbe6;
      }

      .chat-item:hover strong,
      .chat-item:hover .flat-location {
        color: #1b2348;
      }

      .main-content {
        padding: 0;

        overflow: hidden;
      }

      /* ===== CHAT LAYOUT ===== */
      .chat-layout {
        overflow: hidden;
        height: calc(100vh - 57px);
      }

      /* ===== LEFT CHAT LIST ===== */

      .p-3 {
        color: #bfdbe6;
        
      }

      .list a:hover {
        align-items: center;
        background-color: #bfdbe6;
        color: #1b2348;
      }
      .main-content {
        border: none;
      }

      .context {
        min-width: 0; 
       
        flex: 1;
        display: flex;
        align-items: center;
        justify-content: center;
        color: #1b2348;
      }
      .context h2 {
        font-size: 2.5rem;
        opacity: 0.6;
        user-select: none;
      }
      .context img {
        padding-bottom: 2px;
      }
      @media (max-width: 768px) {
        .btn1 {
          gap: 2px;
          display: flex;
          align-items: left;
        }
        .btn1 span {
          font-size: 10px;
        }
       
        .app-layout.sidebar-expanded {
          grid-template-columns: 30% 30% 1fr;
        }
      }
    </style>
    {% block extra_css %}{% endblock %}
  </head>

  <body>
    <div class="app-layout" id="layout">
      <!-- 🔹 NAVBAR -->
      <header>
        <nav class="navbar navbar-dark">
          <div class="container-fluid">
            <div
              class="navbar-brand d-flex align-items-center gap-0.5"
              style="pointer-events: none"
            >
              <img
                src="{{ url_for('static', path='favicon.png') }}"
                alt="FlatMate Finder Logo"
                width="28"
                height="28"
              />
              <span class="fw-semibold fs-5">FlatMate Finder</span>
            </div>

            <ul class="navbar-nav flex-row ms-auto">
              <li class="nav-item dropdown">
                <a
                  class="nav-link dropdown-toggle"
                  href="#"
                  role="button"
                  data-bs-toggle="dropdown"
                >
                  <img
                    src="https://cdn.pixabay.com/photo/2023/02/18/11/00/icon-7797704_1280.png"
                    class="rounded-circle"
                    height="32"
                  />
                </a>

                <ul class="dropdown-menu dropdown-menu-end">
                  <li>
                    <a class="dropdown-item" href="#"
                      >{{ current_user.username }}</a
                    >
                  </li>
                  <li>
                    <a class="dropdown-item" href="/dash/logout">Logout</a>
                  </li>
                </ul>
              </li>
            </ul>
          </div>
        </nav>
      </header>

      <!-- 🔹 SIDEBAR -->
      <aside class="sidebar-wrapper">
        <div class="sidebar">
          <button class="sidebar-toggle" onclick="toggleSidebar()">☰</button>

          <button class="btn1" onclick="window.location.href ='/dash'">
            <span class="icon">🏠</span>
            <span>Home</span>
          </button>

          <button
            class="btn1"
            onclick="window.location.href
            ='/dash/flatpost/createpost'"
          >
            <span class="icon">➕</span>
            <span>Create Post</span>
          </button>

          <button class="btn1" onclick="window.location.href ='/dash/myposts'">
            <span class="icon">📄</span>
            <span>My Posts</span>
          </button>

          <button
            class="btn1"
            onclick="window.location.href
            ='/messages/chats'"
          >
            <span class="icon">💬</span>
            <span>Messages</span>
          </button>
        </div>
      </aside>
      {% if not receiver %}
      <aside class="inbox-wrapper">
        <div class="inbox">
          <button class="inbox-toggle" onclick="toggleInbox()">💬</button>

          <div class="chat-list">
            <h5 class="p-3" style="pointer-events: none align-text: center";>Inbox</h5>

            <ul class="list-group list-group-flush w-100">
              {% for chat in chat_users %}
              <a
                href="/messages/m{{ chat.user.id }}?flat_id={{ chat.flat.id }}"
                class="chat-item"
              >
                <strong>{{ chat.user.username }}</strong>
                <small class="flat-location">
                  📍 {{ chat.flat.location }}
                </small>
              </a>
              {% endfor %}
            </ul>
          </div>
        </div>
      </aside>
      {% endif %}

      <main class="main-content">
        <div class="chat-layout">
          
      <div class="context">
        <h2>
            <img
              src="{{ url_for('static', path='favicon.png') }}"
              alt="Logo"
              width="55"
              height="55"
            />FlatMate Finder
          </h2>
      </div>

          

          {% block chatcontent %}{% endblock %}
        
      </main>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
      function toggleSidebar() {
        document.getElementById("layout").classList.toggle("sidebar-expanded");
      }

      function toggleInbox() {
        document.getElementById("layout").classList.toggle("inbox-collapsed");
      }
    </script>
  </body>
</html>
