<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link
      rel="icon"
      type="image/png"
      href="{{ url_for('static', path='favicon.png') }}"
    />
    <title>{% block title %}FlatMate Finder{% endblock %}</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background-color: #bfdbe6;
        overflow: hidden;
      }

      /* ===== MAIN GRID ===== */
      .app-layout {
        display: grid;
        grid-template-rows: 57px 1fr;
        grid-template-columns: 56px 1fr; /* THIN sidebar */
        height: 100vh;
        transition: grid-template-columns 0.3s ease;
      }

      .app-layout.sidebar-expanded {
        grid-template-columns: 220px 1fr;
      }

      header {
        box-shadow: 2px 1px 5px 0px rgba(0, 0, 0, 0.62);
        grid-column: 1 / -1;
        background-color: #1b2348;
      }
      .navbar-brand img {
        position: relative;
        top: 0.5px;
        filter: drop-shadow(0 0 4px rgba(191, 219, 230, 0.6));
      }
      .navbar-brand span {
        position: relative;
        top: -1px;
      }

      @media (max-width: 576px) {
        .navbar-brand span {
          font-size: 1.1rem;
        }
      }

      .dropdown-menu {
        position: absolute !important;
        top: 100%;
        right: 0;
        margin-top: 8px;
        transform-origin: top right;
        animation: fadeIn 0.15s ease-in-out;
      }

      @keyframes fadeIn {
        from {
          opacity: 0;
          transform: translateY(-5px);
        }

        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      /* ===== SIDEBAR ===== */
      .sidebar-wrapper {
        box-shadow: 2px 1px 5px 0px rgba(0, 0, 0, 0.62);
        background-color: #1b2348;
        overflow: hidden;
        transition: width 0.5s ease;
      }

      .sidebar {
        padding-top: 10px;
        display: flex;
        flex-direction: column;
        align-items: stretch;
      }

      /* Toggle inside sidebar */
      .sidebar-toggle {
        background-color: #1b2348;
        color: #bfdbe6;
        border: none;
        height: 45px;
        font-size: 20px;
        cursor: pointer;
      }

      .sidebar-toggle:hover {
        background-color: #bfdbe6;
        color: #1b2348;
      }

      /* Sidebar buttons */
      .btn1 {
        background-color: #1b2348;
        color: #bfdbe6;
        height: 45px;
        border: none;
        display: flex;
        align-items: center;
        gap: 15px;
        padding: 0 16px;
        white-space: nowrap;
        overflow: hidden;
      }

      .btn1:hover {
        background-color: #bfdbe6;
        color: #1b2348;
      }

      .btn1 span {
        opacity: 1;
        transition: opacity 0.2s ease;
      }

      .btn1:active {
        transform: scale(0.97);
      }

      /* Show text when expanded */
      .sidebar-expanded .btn1 span {
        opacity: 1;
      }

      /* Icon always visible */
      .icon {
        display: block;
        font-size: 18px;
        width: 24px;
        text-align: center;
      }

      /* ===== MAIN ===== */
      .main-content {
        padding: 20px;
        overflow-y: auto;
      }

      /* ===== MOBILE ===== */
      @media (max-width: 768px) {
        .btn1 {
          gap: 2px;
          padding-left: 11.5px;
          display: flex;
          align-items: left;
        }
        .btn1 span {
          margin-right: 11px;
          font-size: 10px;
        }
        .app-layout {
          grid-template-columns: 35px 1fr;
        }

        .app-layout.sidebar-expanded {
          grid-template-columns: 30% 1fr;
        }
      }
    </style>
    {% block extra_css %} {%endblock%}
  </head>

  <body>
    {% if alert %}
    <div class="alert alert-success alert-dismissible fade show" role="alert">
      {{ alert }}
      <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>
    {% endif %}
    <div class="app-layout" id="layout">
      <!-- NAVBAR -->
      <header>
        <nav class="navbar navbar-dark">
          <div class="container-fluid">
            <div
              class="navbar-brand d-flex align-items-center gap-0.5"
              style="pointer-events: none"
            >
              <img
                src="{{ url_for('static', path='favicon.png') }}"
                alt="FlatMate Finder Logo"
                width="28"
                height="28"
              />
              <span class="fw-semibold fs-5">FlatMate Finder</span>
            </div>

            <ul class="navbar-nav flex-row ms-auto">
              <li class="nav-item dropdown">
                <a
                  class="nav-link dropdown-toggle"
                  href="#"
                  role="button"
                  data-bs-toggle="dropdown"
                >
                  <img
                    src="https://cdn.pixabay.com/photo/2023/02/18/11/00/icon-7797704_1280.png"
                    class="rounded-circle"
                    height="32"
                  />
                </a>

                <ul class="dropdown-menu dropdown-menu-end">
                  <li>
                    <a class="dropdown-item" href="#">
                      {{ current_user.username }}
                    </a>
                  </li>
                  <li>
                    <a class="dropdown-item" href="/dash/logout">Logout</a>
                  </li>
                </ul>
              </li>
            </ul>
          </div>
        </nav>
      </header>

      <!-- SIDEBAR -->
      <aside class="sidebar-wrapper">
        <div class="sidebar">
          <button class="sidebar-toggle" onclick="toggleSidebar()">☰</button>

          <button class="btn1" onclick="window.location.href = '/dash'">
            <span class="icon">🏠</span>
            <span>Home</span>
          </button>

          <button
            class="btn1"
            onclick="window.location.href = '/dash/flatpost/createpost'"
          >
            <span class="icon">➕</span>
            <span>Create Post</span>
          </button>

          <button class="btn1" onclick="window.location.href = '/dash/myposts'">
            <span class="icon">📄</span>
            <span>My Posts</span>
          </button>

          <button
            class="btn1"
            onclick="window.location.href = '/messages/chats'"
          >
            <span class="icon">💬</span>
            <span>Messages</span>
          </button>
        </div>
      </aside>

      <!-- MAIN -->
      <main class="main-content">
        {% block dash %} {% endblock%} {% block createpost %} {% endblock%} {%
        block myposts %} {% endblock%}
      </main>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
      const sidebar = document.querySelector('.sidebar-wrapper');
      sidebar.addEventListener('mouseenter', toggleSidebar);
      sidebar.addEventListener('mouseleave', toggleSidebar);

      function toggleSidebar() {
        document.getElementById('layout').classList.toggle('sidebar-expanded');
      }
    </script>
  </body>
</html>
